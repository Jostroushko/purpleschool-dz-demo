<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
</head>

<body>
    <main>
        <h1>Регистрация</h1>
        <p>Уже есть аккаунт? <a href="">Войти</a></p>
        <form action="">
            <input type="text" placeholder="Имя пользователя" id="user-name" name="user-name" required>
            <input type="text" placeholder="Имя" id="first-name" name="first-name" required>
            <input type="text" placeholder="Фамилия" id="last-name" name="last-name" required>
            <input type="email" placeholder="E-mail" id="email" name="email" required>
            <button type="submit">Зарегистрироваться</button>
            <label for="terms">
                <input type="checkbox" id="terms" name="terms" required>
                Я прочитал и принимаю <a href="">Условия использования</a>
            </label>
        </form>
    </main>
</body>

</html>
